[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 120
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/serve.py" = ["S104"]  # binds 0.0.0.0 inside the container; compose publishes only 127.0.0.1
