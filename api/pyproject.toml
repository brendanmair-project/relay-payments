[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The image's /app is read-only for the non-root user, so pytest keeps no cache there.
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
source = ["app"]
branch = true
data_file = "/tmp/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test-only placeholder keys
"migrations/**" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "/tmp/mypy-cache"
plugins = ["pydantic.mypy"]
