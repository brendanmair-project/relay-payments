# CI for Relay (REL-13). Scope, tools and minute budget: docs/decisions/0007-development-tooling-and-ci-scope.md.
# Minute rules (ADR-0012, workspace projects/README.md): branch pushes run only on main because pull requests cover
# branches, every job has timeout-minutes, and images are pinned exactly (maintenance/test-project-hygiene.ps1); the runner is pinned too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly dependency audit, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      simulator: ${{ steps.diff.outputs.simulator }}
      frontend: ${{ steps.diff.outputs.frontend }}
      stack: ${{ steps.diff.outputs.stack }}
      sdk: ${{ steps.diff.outputs.sdk }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Compare with the base commit
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            files="ALL"
          else
            files="$(git diff --name-only "$base" HEAD)"
          fi
          echo "Changed files:"; echo "$files"
          flag() {
            if [ "$files" = "ALL" ] || echo "$files" | grep -Eq "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }
          # sdk/ also triggers the backend job: its api/tests/test_sdk_signature_agreement.py imports the SDK source.
          # A push to main that changes only documentation (docs/** or any *.md) runs just the secret scan (REL-58).
          # Pull requests, manual runs and the schedule are never docs-only.
          docs_only=false
          if [ "$EVENT" = "push" ] && [ "$files" != "ALL" ] && [ -n "$files" ] && ! echo "$files" | grep -Evq '^docs/|\.md$'; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          flag api '^(api/|sdk/|scripts/|docker-compose\.yml|\.github/workflows/)'
          flag simulator '^(simulator/|scripts/|\.github/workflows/)'
          flag frontend '^(frontend/|\.github/workflows/)'
          flag sdk '^(sdk/|\.github/workflows/)'
          flag stack '^(api/|simulator/|frontend/|scripts/|docker-compose\.yml|\.env\.example|\.github/workflows/)'

  backend:
    name: Backend lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U relay -d relay_test" --health-interval 5s --health-retries 20
      redis:
        # Valkey, the Redis-compatible open-source stream server (ADR-0012); the service keeps the name redis.
        image: valkey/valkey:9.1.2
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 20
    env:
      RELAY_API_KEY: ci-only-key
      DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay_test
      TEST_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term --cov-report=json:/tmp/coverage.json
      - run: python tools/coverage_gate.py /tmp/coverage.json
      - run: alembic upgrade head

  simulator:
    name: Simulator lint and tests
    needs: changes
    if: needs.changes.outputs.simulator == 'true' && github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELAY_API_KEY: ci-only-key
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Lint the host-side scripts with the simulator's settings
        run: ruff check --config pyproject.toml ../scripts && ruff format --check --config pyproject.toml ../scripts
      - run: pytest

  sdk:
    name: SDK lint, types, tests
    needs: changes
    if: needs.changes.outputs.sdk == 'true' && github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  frontend:
    name: Frontend lint, types, tests, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  e2e:
    name: Stack smoke and e2e (pull requests)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.stack == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare .env with a one-off key
        run: |
          cp .env.example .env
          sed -i "s/^RELAY_API_KEY=.*/RELAY_API_KEY=ci-only-$(openssl rand -hex 16)/" .env
      - name: Build images with layer cache
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=relay
            *.cache-to=type=gha,scope=relay,mode=max
      # No model in CI: the explainer falls back to rules at once, so explanations are deterministic (REL-29).
      - run: docker compose up -d --wait
        env:
          OLLAMA_URL: http://127.0.0.1:9
      - run: python3 scripts/smoke_stack.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: |
          set -a; . ./.env; set +a
          npm --prefix frontend run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  audit:
    name: Dependency audit
    needs: changes
    # Every run, not only lock-file changes: new advisories appear against unchanged pins (2026-10-26, ADR-0007 amendment).
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: pip install pip-audit==2.10.1
      # The dev files include the runtime ones; the api image ships its test dependencies too (ADR-0011).
      - run: pip-audit -r api/requirements-dev.txt -r simulator/requirements-dev.txt
      - run: npm audit --audit-level=high
        working-directory: frontend

  semgrep:
    name: Static security analysis (Semgrep)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.182.1
      - run: semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten --error --metrics off
