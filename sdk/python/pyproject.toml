[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-sdk"
version = "0.1.0"
description = "Python client for the Relay payments API (payments and webhooks); install from the repository, not published."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relay_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 120
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["S104"]  # the example receiver binds an address chosen by the reader

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "/tmp/mypy-cache"
