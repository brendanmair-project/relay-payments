# Prometheus scrape config (REL-33, ADR-0006). Targets are the compose service names; the metrics ports are reachable
# only inside the compose network and need no key (docs/architecture/containers.md, "Metrics access rule").
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: relay-api
    static_configs:
      - targets: ["api:9100"]
  - job_name: relay-worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: relay-publisher
    static_configs:
      - targets: ["publisher:9100"]
  - job_name: relay-incidents
    static_configs:
      - targets: ["incidents:9100"]
  - job_name: relay-webhooks
    static_configs:
      - targets: ["webhooks:9100"]
